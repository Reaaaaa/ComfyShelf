<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ComfyShelf</title>
  <desc id="desc">Three stored workflow node chains, with the active middle workflow pulled forward.</desc>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="#162126" stroke="#31504d" stroke-width="8"/>

  <!-- Shelf markers: one quiet vertical stop for each stored workflow. -->
  <rect x="88" y="130" width="22" height="68" rx="11" fill="#426d68"/>
  <rect x="88" y="222" width="22" height="68" rx="11" fill="#79afa7"/>
  <rect x="88" y="314" width="22" height="68" rx="11" fill="#426d68"/>

  <!-- Connections are drawn first so every line ends cleanly beneath its nodes. -->
  <rect x="254" y="157" width="36" height="14" rx="7" fill="#426d68"/>
  <rect x="292" y="249" width="38" height="14" rx="7" fill="#79afa7"/>
  <rect x="218" y="341" width="38" height="14" rx="7" fill="#426d68"/>

  <rect x="132" y="137" width="128" height="54" rx="12" fill="#426d68"/>
  <rect x="284" y="137" width="128" height="54" rx="12" fill="#426d68"/>
  <rect x="194" y="229" width="104" height="54" rx="12" fill="#79afa7"/>
  <rect x="324" y="229" width="104" height="54" rx="12" fill="#79afa7"/>
  <rect x="132" y="321" width="92" height="54" rx="12" fill="#426d68"/>
  <rect x="250" y="321" width="92" height="54" rx="12" fill="#426d68"/>
</svg>
